name: Install Full Linux Shell Environment

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  full_shell_setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update System
        run: |
          sudo apt-get update
          sudo apt-get upgrade -y

      - name: Install Core Shell Environment
        run: |
          sudo apt-get install -y \
            bash \
            zsh \
            fish \
            coreutils \
            build-essential \
            gcc \
            g++ \
            make \
            cmake \
            git \
            curl \
            wget \
            unzip \
            zip \
            tar \
            xz-utils \
            nano \
            vim \
            htop \
            tree \
            net-tools \
            iputils-ping \
            dnsutils \
            openssh-client \
            ca-certificates \
            software-properties-common

      - name: Install Python + Pip
        run: |
          sudo apt-get install -y python3 python3-pip

      - name: Install Node.js (LTS)
        run: |
          curl -fsSL https://deb.nodesource.com/setup_lts.x | sudo -E bash -
          sudo apt-get install -y nodejs

      - name: Verify Environment
        run: |
          echo "Kernel:"
          uname -a
          echo "Shells:"
          cat /etc/shells
          echo "Compilers:"
          gcc --version
          node --version
          python3 --version
