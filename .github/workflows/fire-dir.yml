name: FIRE SERVER INFO

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: 🔍 Checkout Repository (NO CLEAN)
        uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 0
          submodules: recursive

      - name: 📁 Show Working Directory
        run: |
          echo "PWD:"
          pwd

      - name: 📂 List Repository Root
        run: |
          echo "ROOT DIRECTORY TREE:"
          ls -R .

      - name: 🧭 Print GitHub Workspace Variables
        run: |
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          echo "GITHUB_ACTION_PATH: $GITHUB_ACTION_PATH"
          echo "GITHUB_REPOSITORY: $GITHUB_REPOSITORY"
          echo "GITHUB_REF: $GITHUB_REF"
          echo "GITHUB_SHA: $GITHUB_SHA"
          echo "RUNNER_WORKSPACE: $RUNNER_WORKSPACE"

      - name: 🧪 Check for Common File Locations
        run: |
          echo "CHECKING FOR FILES:"
          test -f "./README.md" && echo "FOUND: README.md" || echo "MISSING: README.md"
          test -f "./index.php" && echo "FOUND: index.php" || echo "MISSING: index.php"
          test -f "./Becon/" && echo "FOUND: Becon" || echo "MISSING: AVIS-SYNC-INIT.sh"


      - name: 🧵 Print Environment Variables
        run: |
          echo "ENVIRONMENT VARIABLES:"
          env

      - name: 🛠️ Show Runner System Info
        run: |
          echo "SYSTEM INFO:"
          uname -a
          lsb_release -a || true

      - name: 🧱 Show Disk Layout
        run: |
          echo "DISK LAYOUT:"
          df -h

      - name: 🔧 Show Permissions
        run: |
          echo "PERMISSIONS:"
          ls -alR .
