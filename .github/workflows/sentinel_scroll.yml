BGIN
# /* AVIS_COORD: AVIS://GITHUB/WORKFLOW/SCROLL_GEN/1.1.CVBGOD */
# /* ROLE: Automated Data Lake Indexer & Scroll Generator */
# /* INDEX: primary_index */

name: CVBGOD Sentinel Scroll Generator
on:
  push:
    branches: [ main ]
    # BGIN: Ignore bot pushes and scroll updates to kill the loop
    paths-ignore:
      - 'SENTINEL_SCROLL.md'
      - 'sitemap.avis'
      - '.github/workflows/**'

permissions:
  contents: write
  pages: write      # Required for v4 deployment
  id-token: write   # Required for v4 deployment
  actions: read     # Required to resolve artifact metadata errors

jobs:
  generate_scroll:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]' # BGIN: Silence the bot's own voice
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Execute AVIS-Ripper
        run: |
          chmod +x ./scroll_generator.sh
          ./scroll_generator.sh

      - name: Commit Human-Readable Scroll
        run: |
          git config --global user.name "Sentinel-Bot"
          git config --global user.email "bot@cvbgod.sentinel"
          git add SENTINEL_SCROLL.md
          # CRITICAL: [skip ci] kills the ghost artifact loop
          git commit -m "AVIS: Human scroll updated [index] [skip ci]" || exit 0
          git push