# /* AVIS_COORD: AVIS://GITHUB/WORKFLOW/SCROLL_GEN/2.0.CVBGOD */
name: CVBGOD Sentinel Scroll Generator

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build_lake:
    runs-on: ubuntu-latest
    steps:
      - name: SENTINEL :: Checkout
        uses: actions/checkout@v4

      - name: SENTINEL :: Generate Scroll logic
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "# 📜 SENTINEL SCROLL: MERCWAR DATA LAKE" > SENTINEL_SCROLL.md
          echo "Generated: $(date)" >> SENTINEL_SCROLL.md
          echo "" >> SENTINEL_SCROLL.md
          
          # Fetch all repos for mercwar and format them into the scroll
          gh repo list mercwar --limit 100 --json name,url,description --template \
          '{{range .}}### {{.name}}
          - **Link:** {{.url}}
          - **Intel:** {{.description}}
          
          {{end}}' >> SENTINEL_SCROLL.md

      - name: SENTINEL :: Commit & Pulse
        run: |
          git config --global user.name "Sentinel-Bot"
          git config --global user.email "bot@cvbgod.sentinel"
          git add SENTINEL_SCROLL.md
          if ! git diff --staged --quiet; then
            git commit -m "AVIS: Human scroll updated [skip ci]"
            git push origin main
          fi
