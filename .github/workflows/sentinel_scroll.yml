# /* AVIS_COORD: AVIS://GITHUB/WORKFLOW/SCROLL_GEN/1.3.CVBGOD */
# /* ROLE: Automated Data Lake Indexer & Scroll Generator - FINAL PULSE */

name: CVBGOD Sentinel Scroll Generator

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'SENTINEL_SCROLL.md'
      - 'sitemap.avis'
  workflow_dispatch: # Forces the 'Run Workflow' button to appear

permissions:
  contents: write

jobs:
  generate_scroll:
    runs-on: ubuntu-latest
    # Prevents the bot from triggering its own loop
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: SENTINEL :: Checkout Root
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: SENTINEL :: Execute AVIS-Ripper
        run: |
          if [ -f "./scroll_generator.sh" ]; then
            chmod +x ./scroll_generator.sh
            ./scroll_generator.sh
            echo "wm_macro_ack: Ripper cycle complete."
          else
            echo "BASH: [NACK] scroll_generator.sh not found."
            exit 1
          fi

      - name: SENTINEL :: Commit & Dispatch Scroll
        env:
          G_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Sentinel-Bot"
          git config --global user.email "bot@cvbgod.sentinel"

          # Stage the artifacts
          git add SENTINEL_SCROLL.md sitemap.avis || true

          if ! git diff --staged --quiet; then
            git commit -m "AVIS: Human scroll updated [index] [skip ci]"
            
            # Using env variable to safely inject token into the origin URL
            git remote set-url origin "https://x-access-token:${G_TOKEN}@github.com/${{ github.repository }}.git"
            
            git pull --rebase origin main
            git push origin main
            echo "wm_macro_ack: Scroll dispatched to Audit Surface."
          else
            echo "AVIS: No data lake shift detected. Pulse steady."
          fi
