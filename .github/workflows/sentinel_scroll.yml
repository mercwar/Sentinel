name: CVBGOD Sentinel Scroll Generator
on:
  push:
    branches: [ main ]
    # AVIS_GUIDE: Ignore changes to the Scroll itself to prevent loops
    paths-ignore:
      - 'SENTINEL_SCROLL.md'
      - 'sitemap.avis'

permissions:
  contents: write

jobs:
  generate_scroll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cyborg Scrolls
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ensure the bot can see the whole Data Lake

      - name: Execute AVIS-Ripper
        run: |
          chmod +x ./scroll_generator.sh
          ./scroll_generator.sh

- name: Commit Human-Readable Scroll
        run: |
          git config --global user.name "Sentinel-Bot"
          git config --global user.email "bot@cvbgod.sentinel"
          git add SENTINEL_SCROLL.md
          # CRITICAL: [skip ci] kills the ghost artifact loop
          git commit -m "AVIS: Human scroll updated [skip ci]" || exit 0
          git push
``` [INDEX]