# AVIS_COORD: AVIS://GITHUB/WORKFLOW/SCROLL_GEN/1.2.CVBGOD
# ROLE: Automated Data Lake Indexer & Scroll Generator - STABILIZED

name: CVBGOD Sentinel Scroll Generator

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'SENTINEL_SCROLL.md'
      - 'sitemap.avis'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  generate_scroll:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout Root
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute AVIS-Ripper
        run: |
          if [ -f "./scroll_generator.sh" ]; then
            chmod +x ./scroll_generator.sh
            ./scroll_generator.sh
            echo "wm_macro_ack: Ripper cycle complete."
          else
            echo "BASH: [NACK] scroll_generator.sh not found. Check /exec/she path."
            exit 1
          fi

      - name: Commit Human-Readable Scroll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Sentinel-Bot"
          git config --global user.email "bot@cvbgod.sentinel"

          git add SENTINEL_SCROLL.md sitemap.avis

          if ! git diff --staged --quiet; then
            git commit -m "AVIS: Human scroll updated [index] [skip ci]"

            # Correct remote URL format
            git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}

            git pull --rebase origin main
            git push origin main

            echo "wm_macro_ack: Scroll dispatched to Audit Surface."
          else
            echo "AVIS: No data lake shift detected. Pulse steady."
          fi
