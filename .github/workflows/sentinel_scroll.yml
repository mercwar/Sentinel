# AVIS_COORD: AVIS://GITHUB/WORKFLOW/SCROLL_GEN/2.0.CVBGOD

name: CVBGOD Sentinel Scroll Generator

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build_lake:
    runs-on: ubuntu-latest

    steps:
      - name: SENTINEL :: Checkout
        uses: actions/checkout@v4

      - name: SENTINEL :: Generate Scroll Logic
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          {
            echo "# 📜 SENTINEL SCROLL: MERCWAR DATA LAKE"
            echo ""
            echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
          } > SENTINEL_SCROLL.md

          # Pull repo intel
          gh repo list mercwar \
            --limit 100 \
            --json name,url,description \
            --template '{{range .}}### {{.name}}
- **Link:** {{.url}}
- **Intel:** {{if .description}}{{.description}}{{else}}No description available{{end}}

{{end}}' >> SENTINEL_SCROLL.md

      - name: SENTINEL :: Commit & Pulse
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add SENTINEL_SCROLL.md

          if ! git diff --cached --quiet; then
            git commit -m "AVIS: Human scroll updated [skip ci]"
            git push
          else
            echo "No scroll changes detected."
          fi
