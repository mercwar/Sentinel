name: Sentinal Install GCC + AI Core

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System Update
        run: |
          sudo apt-get update
          sudo apt-get upgrade -y

      # ===============================
      # 🧠 GCC FULL CORE
      # ===============================
      - name: Install GCC Core
        run: |
          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            gdb \
            make \
            cmake \
            pkg-config \
            libtool \
            autoconf \
            automake \
            nasm \
            clang \
            llvm

      # Optional: multi-arch (32-bit support)
      - name: Enable Multiarch
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      # ===============================
      # 🔬 AI / ML CORE (C + Python Bridge)
      # ===============================
      - name: Install Python AI Core
        run: |
          sudo apt-get install -y python3 python3-pip python3-venv
          python3 -m pip install --upgrade pip
          pip install numpy scipy pandas matplotlib scikit-learn

      # Optional: PyTorch CPU version
      - name: Install PyTorch (CPU)
        run: |
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu

      # Optional: ONNX Runtime (C++ friendly)
      - name: Install ONNX Runtime
        run: |
          pip install onnxruntime

      # ===============================
      # 🔍 VERIFY
      # ===============================
      - name: Verify Install
        run: |
          echo "Kernel:"
          uname -a
          echo "GCC:"
          gcc --version
          echo "Clang:"
          clang --version
          echo "Python:"
          python3 --version
          echo "Torch:"
          python3 -c "import torch; print(torch.__version__)"
