name: FIRE-CYHY-MERC-G-PORTAL

on:
  workflow_run:
    workflows: ["Fire-Gem AVIS Engine"]
    types: [completed]
  workflow_dispatch:

jobs:
  portal-sync:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write

    steps:
      # 1️⃣ Checkout Repository
      - name: Checkout Root
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Install Unzip Only
      - name: Install Unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      # 3️⃣ Materialize Sentinel Beacon
      - name: Unzip Beacon Scroll
        run: |
          mkdir -p "Sentinel/beacon/"

          if [ -f "./beacon/gemini-001.scroll.zip" ]; then
            unzip -o "./beacon/gemini-001.scroll.zip" -d "Sentinel/beacon/"
            echo "BASH: [ACK] gemini-001.scroll.zip deployed from ./beacon/"
          elif [ -f "gemini-001.scroll.zip" ]; then
            unzip -o "gemini-001.scroll.zip" -d "Sentinel/beacon/"
            echo "BASH: [ACK] gemini-001.scroll.zip deployed from root."
          else
            echo "BASH: [NACK] SOURCE_MISSING: gemini-001.scroll.zip not found."
            exit 1
          fi

      # 4️⃣ Commit + Push
      - name: Final Server Sync
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Sentinel/beacon/

          if ! git diff --staged --quiet; then
            git commit -m "AVIS: Beacon Scroll Materialized (gemini-001.scroll.zip)"
            git pull --rebase -X ours origin main
            git push origin main
            echo "wm_macro_ack: Portal Sync Successful."
          else
            echo "AVIS: No changes detected."
          fi
