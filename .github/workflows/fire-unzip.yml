- name: THE ZIPPER STRIKE
        run: |
          # 1. SEAT THE SENTENEL VAULT
          mkdir -p "Sentenel/becon/"
          
          # 2. MATERIALIZE THE SCROLL
          if [ -f "./becon/gemini-0001-scroll.zip" ]; then
            unzip -o ./becon/gemini-0001-scroll.zip -d "Sentenel/becon/"
