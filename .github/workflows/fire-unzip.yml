name: FIRE-CYHY-MERC-G-PORTAL

on:
  workflow_run:
    workflows: ["Fire-Gem AVIS Engine"]
    types: [completed]
  workflow_dispatch:

jobs:
  package-portal:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write

    steps:
      # 1️⃣ Checkout Repository
      - name: Checkout Root
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Install Required Tools
      - name: Install Zip Utilities
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      # 4️⃣ Materialize Sentinel Vault
      - name: Materialize Sentinel Beacon
        run: |
          mkdir -p "Sentinel/beacon/"

          if [ -f "./beacon/gemini-0001-scroll.zip" ]; then
            unzip -o "./beacon/gemini-0001-scroll.zip" -d "Sentinel/beacon/"
            echo "BASH: [ACK] Scroll deployed to Sentinel/beacon/."
          elif [ -f "gemini-0001-scroll.zip" ]; then
            unzip -o "gemini-0001-scroll.zip" -d "Sentinel/beacon/"
            echo "BASH: [ACK] Scroll deployed from root."
          else
            echo "BASH: [INFO] gemini-0001-scroll.zip not found. Skipping."
          fi

      # 5️⃣ Regenerate Sitemap (Optional)
      - name: Fire Site Generator
        run: |
          if [ -f "./fire-site.sh" ]; then
            chmod +x ./fire-site.sh
            ./fire-site.sh
            echo "BASH: Sitemap regenerated."
          fi

      # 6️⃣ Commit + Sync Changes
      - name: Final Server Sync
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Sentinel/beacon/ || true
          git add sitemap.xml || true

          if ! git diff --staged --quiet; then
            git commit -m "AVIS: FIRE-CYHY-MERC-G Portal Update"
            git pull --rebase -X ours origin main
            git push origin main
            echo "wm_macro_ack: Portal Sync Successful."
          else
            echo "AVIS: No changes detected."
          fi
